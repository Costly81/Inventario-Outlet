<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: usa toda la pantalla del iPhone (con muesca) y respeta las zonas seguras -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#cdeffd">
  <meta name="description" content="Inventario, ventas y dólar en vivo para la tienda">
  <!-- Para «Agregar a pantalla de inicio» en iPhone y Android: se abre como una app, sin barra del navegador -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Outlet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icono-180.png">
  <link rel="stylesheet" href="/css/app.css">
  <title>Inventario Outlet</title>
</head>
<body>
  <!-- Cielo con nubes (decorativo) -->
  <div class="cielo" aria-hidden="true"><i class="nube n1"></i><i class="nube n2"></i><i class="nube n3"></i></div>

  <!-- Aquí se dibuja toda la aplicación (js/app.js) -->
  <div id="app" aria-live="polite">
    <div class="entrada-pantalla"><div class="esqueleto" style="width:64px;height:64px;border-radius:22px"></div></div>
  </div>

  <!-- Avisos flotantes -->
  <div class="avisos" id="avisos" role="status" aria-live="polite"></div>

  <noscript><p style="padding:24px;text-align:center">Este sistema necesita JavaScript activado en el navegador.</p></noscript>

  <script src="/js/qr.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
